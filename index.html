<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Acesse o CRM Atendimento e Vendas para acompanhar leads e atendimentos."
    >
    <meta name="theme-color" content="#4f46e5">
    <title>Entrar | CRM Atendimento &amp; Vendas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
  </head>
  <body>
    <main class="login-page">
      <img
        class="login-page__background"
        src="https://res.cloudinary.com/dc0qqgkmp/image/upload/f_auto,q_auto,w_1440,c_fill/v1793738037/crm-atendimento/geralt-office-10300126_isugmr.jpg"
        srcset="
          https://res.cloudinary.com/dc0qqgkmp/image/upload/f_auto,q_auto,w_768,c_fill/v1793738037/crm-atendimento/geralt-office-10300126_isugmr.jpg 768w,
          https://res.cloudinary.com/dc0qqgkmp/image/upload/f_auto,q_auto,w_1440,c_fill/v1793738037/crm-atendimento/geralt-office-10300126_isugmr.jpg 1440w,
          https://res.cloudinary.com/dc0qqgkmp/image/upload/f_auto,q_auto,w_1920,c_fill/v1793738037/crm-atendimento/geralt-office-10300126_isugmr.jpg 1920w
        "
        sizes="100vw"
        alt=""
        aria-hidden="true"
        fetchpriority="high"
      >

      <div class="login-page__overlay" aria-hidden="true"></div>

      <div class="container login-page__content">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
            <section class="login-card" aria-labelledby="page-title">
              <header class="login-card__header">
                <a class="brand-mark" href="index.html" aria-label="CRM Atendimento e Vendas - início">
                  <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M13.2 2.75 5.9 13h5.15l-.3 8.25L18.1 11h-5.15l.25-8.25Z"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                    />
                  </svg>
                </a>
                <h1 class="login-card__title" id="page-title">
                  CRM Atendimento <span>&amp; Vendas</span>
                </h1>
                <p class="login-card__subtitle">
                  Central de captação multicanal e gestão comercial
                </p>
              </header>

              <div class="login-card__intro">
                <h2 class="login-card__welcome">Bem-vindo de volta</h2>
                <p class="login-card__description">
                  Entre com seus dados para acessar sua conta.
                </p>
              </div>

              <form action="#" method="post">
                <div class="mb-3">
                  <label class="form-label" for="email">E-mail</label>
                  <input
                    class="form-control form-control-lg"
                    id="email"
                    name="email"
                    type="email"
                    placeholder="voce@empresa.com.br"
                    autocomplete="email"
                    required
                  >
                </div>

                <div class="mb-4">
                  <label class="form-label" for="password">Senha</label>
                  <input
                    class="form-control form-control-lg"
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                  >
                </div>

                <button class="btn btn-primary btn-lg w-100" type="submit">
                  Entrar
                </button>
              </form>

              <p class="login-card__signup mb-0">
                Ainda não é cadastrado?
                <a class="login-card__signup-link" href="cadastro.html">Cadastre-se</a>
              </p>
            </section>
          </div>
        </div>
      </div>

      <footer class="login-page__footer">
        &copy; 2026 CRM Atendimento &amp; Vendas
      </footer>
    </main>
  </body>
</html>
